org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Backend the app talks to. 10.0.2.2 is the emulator's alias for the host machine.
# Override with -PbonvoyBaseUrl=https://... or BONVOY_BASE_URL env var.
bonvoyBaseUrl=http://10.0.2.2:3000

# Optional: Devin org for backend-triggered sessions (sent as devinOrgId).
# Empty = backend's default org. Override with -PdevinOrgId=org-... or DEVIN_ORG_ID env var.
devinOrgId=
